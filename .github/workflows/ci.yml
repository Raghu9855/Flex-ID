name: FLEX-ID CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Code Quality & Linting Check
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity
          flake8 app tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Execute Automated Pytest Suite
        run: |
          pytest -v

  docker-build:
    name: Docker Container Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: flex-id-backend:test
          load: true

      - name: Smoke Test Container Runtime
        run: |
          # Launch container in background
          docker run -d --name flex-id-smoke -p 8000:8000 -e ENVIRONMENT=production flex-id-backend:test

          # Poll health endpoint until ready (up to 30 seconds)
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

          # Print health output
          curl -s http://localhost:8000/health | grep '"status":"healthy"'

          # Teardown test container
          docker stop flex-id-smoke
